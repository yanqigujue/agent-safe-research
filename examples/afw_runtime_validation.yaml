experiment_name: afw-runtime-validation
dataset_path: data/afw_runtime_power_ops_cases.jsonl
output_dir: ../runs
graph:
  nodes:
    - name: capguard
      node_id: guardrail.afw_capguard
    - name: evaluate
      node_id: evaluate.afw_runtime
      config:
        min_behmatch: 0.8
        require_no_false_allow: true
  edges:
    - from: START
      to: capguard
    - from: capguard
      to: evaluate
    - from: evaluate
      to: END
