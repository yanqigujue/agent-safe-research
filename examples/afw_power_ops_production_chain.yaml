schema_version: afw-production-chain-v0.1
scenario: power_equipment_ops_kb_qa
description: Electric power equipment operations RAG QA chain with AFW field-authority guardrail.
deployment_mode: local_openai_compatible
concurrency:
  target_concurrent_operators: 32
  peak_concurrent_operators: 64
hardware:
  gpu_count: 1
  gpu_memory_gb: 24
  api_mode: local_openai_compatible
models:
  embedding:
    role: embedding
    provider: local
    model_id: bge-large-zh-v1.5
    api: embeddings
    estimated_memory_gb: 2
    input: uploaded_manual_chunks
    output: vector_index
  rerank:
    role: rerank
    provider: local
    model_id: bge-reranker-large
    api: rerank
    estimated_memory_gb: 4
    input: retrieved_fragments
    output: ranked_fragments
  generation:
    role: generation
    provider: local
    model_id: qwen2.5-7b-instruct
    api: chat_completions
    estimated_memory_gb: 14
    input: ranked_fragments
    output: answer_or_action_field
rag_flow:
  - document_upload
  - embedding_retrieval
  - rerank
  - generation
  - afw_capguard
  - evaluate_afw_runtime
constraints:
  max_total_model_memory_gb: 22
  require_embedding_model: true
  require_rerank_model: true
  require_generation_model: true
  require_afw_guardrail: true
  require_api_compatibility: true
